    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-dyslexic">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/opendyslexic">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic-fonts@0.0.1/open-dyslexic.css">

    <!-- Anti-flash LocalStorage Initialization Script for OpenDyslexic Font Preference -->
    <script>
      (function() {
        try {
          var isDyslexic = localStorage.getItem('wcag-open-dyslexic') === 'true';
          if (isDyslexic) {
            document.documentElement.classList.add('wcag-open-dyslexic');
            if (document.body) {
              document.body.classList.add('wcag-open-dyslexic');
            } else {
              document.addEventListener('DOMContentLoaded', function() {
                if (document.body) {
                  document.body.classList.add('wcag-open-dyslexic');
                }
              });
            }
          }
        } catch (e) {}
      })();
    </script>
